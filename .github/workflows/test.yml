name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-and-python:
    name: shell-and-python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Shell syntax
        run: bash -n welcome-board.sh bin/wb bin/welcomeboard install.sh
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
